[package]
name = "zettacache"
version = "0.1.0"
authors = ["Delphix"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
async-stream = "0.3.0"
bimap = "0.6.1"
bincode = "1.3.2"
bytes = "1.0"
chrono = "0.4"
conv = "0.3.3"
either = "1.6.1"
futures = "0.3.13"
futures-core = "0.3.13"
lazy_static = "1.4.0"
libc = "0.2"
log = "0.4"
lru = "0.7.0"
lz4 = "1.23.2"
more-asserts = "0.2.1"
nix = "0.23.0"
num = "0.4.0"
rand = "0.8.3"
roaring = "0.7.0"
seahash = "4.1.0"
serde = { version = "1.0.125", features = ["derive", "rc"] }
serde_json = "1.0.64"
sysinfo = "0.21.1"
tokio = { version = "1.4", features = ["full"] }
util = { path = "../util" }
uuid = {version = "0.8.2", features = ["v4", "serde"]}
