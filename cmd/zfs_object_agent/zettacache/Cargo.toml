[package]
name = "zettacache"
version = "0.1.0"
authors = ["Delphix"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
arc-swap = "1.5.0"
bimap = "0.6.1"
bincode = "1.3.2"
bytes = "1.0"
bytesize = "1.1.0"
chrono = "0.4"
conv = "0.3.3"
derivative = "2.2.0"
either = "1.6.1"
futures = "0.3.13"
futures-core = "0.3.13"
lazy_static = "1.4.0"
libc = "0.2"
log = "0.4"
lru = "0.7.0"
lz4 = "1.23.2"
more-asserts = "0.2.1"
nix = "0.24.1"
num-traits = "0.2.14"
rand = "0.8.3"
safer-ffi = { version = "0.0.7", features = ["proc_macros"] }
seahash = "4.1.0"
serde = { version = "1.0.125", features = ["derive", "rc"] }
serde_json = "1.0.64"
sysinfo = "0.23.5"
tokio = { version = "1.4", features = ["full"] }
tokio-stream = "0.1.8"
util = { path = "../util" }
uuid = {version = "1.0.0", features = ["v4", "serde"]}
