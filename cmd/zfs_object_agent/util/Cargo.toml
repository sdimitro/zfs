[package]
name = "util"
version = "0.1.0"
authors = ["Delphix"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
anyhow = "1.0"
arr_macro = "0.1.3"
async-trait = "0.1.51"
atty = "0.2"
atomic-counter = "1.0.1"
backtrace = "0.3"
bytes = "1.0"
bytesize = "1.1.0"
chrono = "0.4.19"
config = "0.12"
dashmap = "5.1.0"
derivative = "2.2.0"
enum-map = { version = "2.0.3", features = ["serde"] }
futures = "0.3.16"
humantime = "2.1.0"
lazy_static = "1.4.0"
log = "0.4"
log4rs = "1.0.0"
libc = "0.2"
lru = "0.7.0"
more-asserts = "0.2.1"
num-traits = "0.2.14"
paste = "1.0.6"
rand = "0.8.3"
rusoto_credential = "0.47.0"
safer-ffi = { version = "0.0.7", features = ["proc_macros"] }
serde = { version = "1.0.125", features = ["derive"] }
serde_json = "1.0.64"
serial_test = "0.6.0"
signal-hook = "0.3.13"
tokio = { version = "1.4", features = ["full"] }
uuid = {version = "0.8.2", features = ["v4", "serde"]}
