[package]
name = "util"
version = "0.1.0"
authors = ["Delphix"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
anyhow = "1.0"
arr_macro = "0.1.3"
async-trait = "0.1.51"
atty = "0.2"
backtrace = "0.3"
bytes = "1.0"
chrono = "0.4.19"
config = "0.11"
enum-map = { version = "1.1.1", features = ["serde"] }
lazy_static = "1.4.0"
log = "0.4"
log4rs = "1.0.0"
more-asserts = "0.2.1"
num-traits = "0.2.14"
rand = "0.8.3"
rusoto_credential = "0.47.0"
safer-ffi = { version = "0.0.6", features = ["proc_macros"] }
serde = { version = "1.0.125", features = ["derive"] }
tokio = { version = "1.4", features = ["full"] }
uuid = {version = "0.8.2", features = ["v4", "serde"]}
