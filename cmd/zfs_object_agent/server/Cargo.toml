[package]
name = "zfs_object_agent"
version = "0.1.0"
authors = ["Delphix"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4"
clap = { version = "3.1.6", features = ["derive"] }
