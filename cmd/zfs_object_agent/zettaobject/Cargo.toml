[package]
name = "zettaobject"
version = "0.1.0"
authors = ["Delphix"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
arr_macro = "0.1.3"
azure_core = { version = "0.2.2"} # , default-features = false, features = ["enable_hyper", "azurite_workaround"]
azure_identity = "0.3.0"
azure_storage = "0.2.0"
azure_storage_blobs = "0.2.0"
async-stream = "0.3.0"
async-trait = "0.1.52"
base64 = "0.13.0"
bincode = "1.3.2"
bytes = "1.0"
bytesize = "1.1.0"
chrono = "0.4"
conv = "0.3.3"
cstr-argument = "0.1.1"
derivative = "2.2.0"
dirs-next = "2.0.0"
enum-map = "2.0.3"
fs2 = "0.4.2"
futures = "0.3.13"
futures-core = "0.3.13"
hostname = "0.3.1"
http = "0.2.4"
lazy_static = "1.4.0"
libc = "0.2"
log = "0.4"
log4rs = "1.0.0"
more-asserts = "0.2.1"
nix = "0.24.1"
num-traits = "0.2.14"
nvpair = { git = "https://github.com/delphix/rust-libzfs"}
rand = "0.8.3"
rusoto_core = "0.48.0"
rusoto_credential = "0.48.0"
rusoto_s3 = "0.48.0"
rust-ini = "0.18.0"
safer-ffi = { version = "0.0.7", features = ["proc_macros"] }
semver = "1.0.4"
serde = { version = "1.0.125", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.64"
serde-xml-rs = "0.5.1"
stream-reduce = "0.1.0"
tokio = { version = "1.4", features = ["full"] }
tokio-stream = "0.1.5"
url = "2.2"
util = { path = "../util" }
uuid = {version = "1.0.0", features = ["v4", "serde"]}
zettacache = { path = "../zettacache" }
