[package]
name = "zcachedb"
version = "0.1.0"
authors = ["Delphix"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
clap = { version = "3.1.6", features = ["derive"] }
exitcode = "1.1.2"
git-version = "0.3.5"
libc = "0.2"
log = "0.4"
tokio = { version = "1.4", features = ["full"] }
util = { path = "../util" }
zettacache = { path = "../zettacache" }
